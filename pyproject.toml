[project]
name = "fiotrix"
version = "0.1.0"
description = "FastAPI + SQLAlchemy API with PostgreSQL, Swagger docs, and systemd."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "gunicorn>=26.2.0",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false
